name: Cordova Android Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # or your project's version

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Java and Gradle
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  # or '11', depending on your Android SDK needs

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Install Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          script: echo "Android SDK installed"

      - name: Install Cordova Platforms and Plugins
        run: |
          npm ci
          cordova platform add android
          cordova prepare

      - name: Build Cordova Android
        run: cordova build android
