name: Angular CI with REST API Notification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular app
        run: npm run build

      - name: Notify success via Adaptive Card
        if: success()
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          TIME="$(date -u +"%Y-%m-%d %H:%M UTC")"

          curl -X POST https://jsonplaceholder.typicode.com/todos/1 \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"message\",
              \"attachments\": [
                {
                  \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                  \"content\": {
                    \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                    \"type\": \"AdaptiveCard\",
                    \"version\": \"1.3\",
                    \"body\": [
                      {
                        \"type\": \"TextBlock\",
                        \"size\": \"Large\",
                        \"weight\": \"Bolder\",
                        \"color\": \"Good\",
                        \"text\": \"✅ Build Succeeded!\"
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Repository: $REPO\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Branch: $BRANCH\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Commit: $COMMIT\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Triggered by: $ACTOR\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Time: $TIME\",
                        \"wrap\": true
                      }
                    ]
                  }
                }
              ]
            }"

      - name: Notify failure via Adaptive Card
        if: failure()
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          TIME="$(date -u +"%Y-%m-%d %H:%M UTC")"

          curl -X POST https://jsonplaceholder.typicode.com/todos/1 \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"message\",
              \"attachments\": [
                {
                  \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                  \"content\": {
                    \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                    \"type\": \"AdaptiveCard\",
                    \"version\": \"1.6\",
                    \"body\": [
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"❌ GitHub Action Failed\",
                        \"weight\": \"Bolder\",
                        \"size\": \"Large\",
                        \"color\": \"Attention\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"The **Build & Test Workflow** failed. Please review the logs below.\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"FactSet\",
                        \"facts\": [
                          {
                            \"title\": \"Repository:\",
                            \"value\": \"$REPO\"
                          },
                          {
                            \"title\": \"Branch:\",
                            \"value\": \"$BRANCH\"
                          },
                          {
                            \"title\": \"Status:\",
                            \"value\": \"Failure\"
                          },
                          {
                            \"title\": \"Commit:\",
                            \"value\": \"$COMMIT\"
                          },
                          {
                            \"title\": \"Actor:\",
                            \"value\": \"$ACTOR\"
                          },
                          {
                            \"title\": \"Time:\",
                            \"value\": \"$TIME\"
                          }
                        ]
                      }
                    ],
                    \"actions\": [
                      {
                        \"type\": \"Action.OpenUrl\",
                        \"title\": \"📄 View Logs\",
                        \"url\": \"https://github.com/$REPO/actions\",
                        \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                      },
                      {
                        \"type\": \"Action.OpenUrl\",
                        \"title\": \"🔗 View Repository\",
                        \"url\": \"https://github.com/$REPO\",
                        \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                      }
                    ]
                  }
                }
              ]
            }"
