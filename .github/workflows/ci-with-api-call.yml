name: Angular CI with REST API Notification

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened]

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set-result.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular app
        run: npm run build

      - name: Set build result
        id: set-result
        run: echo "Setting result..."

  notify:
    if: ${{ github.event_name == 'push' && always() }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Send Adaptive Card
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          TIME="$(date -u +"%Y-%m-%d %H:%M UTC")"
          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT}"
          LOGS_URL="https://github.com/${REPO}/actions"
          REPO_URL="https://github.com/${REPO}"
          WORKFLOW_NAME="${{ github.workflow }}"

          if [ "${{ needs.build.result }}" = "success" ]; then
            STATUS_TEXT="✅ Deployment Succeeded"
            STATUS_COLOR="Good"
            STATUS="Success"
          else
            STATUS_TEXT="❌ Deployment Failed"
            STATUS_COLOR="Attention"
            STATUS="Failure"
          fi

          curl -X POST "https://prod-21.centralindia.logic.azure.com:443/workflows/33e17a68662d4dd19c91c0ffc4ed0b9c/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GPjG3lpjJiqNehjS_DXL9wumNle5dMD6y6WNCbLuhms" \
          -H "Content-Type: application/json" \
          -d "{
            \"type\": \"message\",
            \"attachments\": [
              {
                \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                \"content\": {
                  \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                  \"type\": \"AdaptiveCard\",
                  \"version\": \"1.4\",
                  \"body\": [
                    {
                      \"type\": \"TextBlock\",
                      \"text\": \"${STATUS_TEXT}\",
                      \"weight\": \"Bolder\",
                      \"size\": \"Large\",
                      \"color\": \"${STATUS_COLOR}\",
                      \"wrap\": true
                    },
                    {
                      \"type\": \"TextBlock\",
                      \"text\": \"The *${WORKFLOW_NAME}* workflow completed. Details are below.\",
                      \"wrap\": true
                    },
                    {
                      \"type\": \"FactSet\",
                      \"facts\": [
                        { \"title\": \"App\", \"value\": \"IoT Monitor\" },
                        { \"title\": \"Environment\", \"value\": \"Production\" },
                        { \"title\": \"Branch\", \"value\": \"${BRANCH}\" },
                        { \"title\": \"Deployed By\", \"value\": \"${ACTOR}\" },
                        { \"title\": \"Commit\", \"value\": \"[${COMMIT}](${COMMIT_URL})\" },
                        { \"title\": \"Time\", \"value\": \"${TIME}\" },
                        { \"title\": \"Status\", \"value\": \"${STATUS}\" }
                      ]
                    }
                  ],
                  \"actions\": [
                    {
                      \"type\": \"Action.OpenUrl\",
                      \"title\": \"📄 View Logs\",
                      \"url\": \"${LOGS_URL}\",
                      \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                    },
                    {
                      \"type\": \"Action.OpenUrl\",
                      \"title\": \"🔗 View Repository\",
                      \"url\": \"${REPO_URL}\",
                      \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                    }
                  ]
                }
              }
            ]
          }"

  notify_pr_opened:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Adaptive Card on PR Opened
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.head_ref }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          AUTHOR="${{ github.actor }}"
          TIME="$(date -u +"%Y-%m-%d %H:%M UTC")"

          curl -X POST "https://prod-21.centralindia.logic.azure.com:443/workflows/33e17a68662d4dd19c91c0ffc4ed0b9c/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GPjG3lpjJiqNehjS_DXL9wumNle5dMD6y6WNCbLuhms" \
          -H "Content-Type: application/json" \
          -d "{
            \"type\": \"message\",
            \"attachments\": [
              {
                \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                \"content\": {
                  \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                  \"type\": \"AdaptiveCard\",
                  \"version\": \"1.4\",
                  \"body\": [
                    {
                      \"type\": \"TextBlock\",
                      \"text\": \"🚀 New Pull Request Opened\",
                      \"weight\": \"Bolder\",
                      \"size\": \"Large\",
                      \"wrap\": true
                    },
                    {
                      \"type\": \"TextBlock\",
                      \"text\": \"*${AUTHOR}* has opened a new pull request: **${PR_TITLE}**\",
                      \"wrap\": true
                    },
                    {
                      \"type\": \"FactSet\",
                      \"facts\": [
                        { \"title\": \"Branch\", \"value\": \"${BRANCH}\" },
                        { \"title\": \"Author\", \"value\": \"${AUTHOR}\" },
                        { \"title\": \"Time\", \"value\": \"${TIME}\" },
                        { \"title\": \"PR #\", \"value\": \"${PR_NUMBER}\" }
                      ]
                    }
                  ],
                  \"actions\": [
                    {
                      \"type\": \"Action.OpenUrl\",
                      \"title\": \"🔍 View Pull Request\",
                      \"url\": \"${PR_URL}\",
                      \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                    }
                  ]
                }
              }
            ]
          }"
