name: Angular CI with REST API Notification

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened]  # This ensures the PR notification runs only when a new PR is opened

jobs:
  notify_pr_opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Send Adaptive Card on PR Opened
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.head_ref }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          AUTHOR="${{ github.actor }}"
          TIME="$(date -u +"%Y-%m-%d %H:%M UTC")"

          curl -X POST "https://prod-21.centralindia.logic.azure.com:443/workflows/33e17a68662d4dd19c91c0ffc4ed0b9c/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GPjG3lpjJiqNehjS_DXL9wumNle5dMD6y6WNCbLuhms" \
          -H "Content-Type: application/json" \
          -d "{
            \"type\": \"message\",
            \"attachments\": [
              {
                \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                \"content\": {
                  \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                  \"type\": \"AdaptiveCard\",
                  \"version\": \"1.4\",
                  \"body\": [
                    {
                      \"type\": \"TextBlock\",
                      \"text\": \"🚀 New Pull Request Opened\",
                      \"weight\": \"Bolder\",
                      \"size\": \"Large\",
                      \"wrap\": true
                    },
                    {
                      \"type\": \"TextBlock\",
                      \"text\": \"*${AUTHOR}* has opened a new pull request: **${PR_TITLE}**\",
                      \"wrap\": true
                    },
                    {
                      \"type\": \"FactSet\",
                      \"facts\": [
                        { \"title\": \"Branch\", \"value\": \"${BRANCH}\" },
                        { \"title\": \"Author\", \"value\": \"${AUTHOR}\" },
                        { \"title\": \"Time\", \"value\": \"${TIME}\" },
                        { \"title\": \"PR #\", \"value\": \"${PR_NUMBER}\" }
                      ]
                    }
                  ],
                  \"actions\": [
                    {
                      \"type\": \"Action.OpenUrl\",
                      \"title\": \"🔍 View Pull Request\",
                      \"url\": \"${PR_URL}\",
                      \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                    }
                  ]
                }
              }
            ]
          }"
