name: Angular CI with REST API Notification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular app
        run: npm run build

      - name: Notify success via Adaptive Card
        if: success()
        run: |
          curl -X POST https://jsonplaceholder.typicode.com/todos/1 \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"message\",
              \"attachments\": [
                {
                  \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                  \"content\": {
                    \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                    \"type\": \"AdaptiveCard\",
                    \"version\": \"1.3\",
                    \"body\": [
                      {
                        \"type\": \"TextBlock\",
                        \"size\": \"Large\",
                        \"weight\": \"Bolder\",
                        \"color\": \"Good\",
                        \"text\": \"✅ Build Succeeded!\"
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Repository: Sanchalvk/Angulardockerfilecreate\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Branch: main\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Commit: 7ce8438b9a1eb677c8c699a4e0294f399b9ff970\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"Triggered by: Sanchalvk\",
                        \"wrap\": true
                      }
                    ]
                  }
                }
              ]
            }"

      - name: Notify failure via Adaptive Card
        if: failure()
        run: |
          curl -X POST https://jsonplaceholder.typicode.com/todos/1 \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"message\",
              \"attachments\": [
                {
                  \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                  \"content\": {
                    \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                    \"type\": \"AdaptiveCard\",
                    \"version\": \"1.6\",
                    \"body\": [
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"❌ GitHub Action Failed\",
                        \"weight\": \"Bolder\",
                        \"size\": \"Large\",
                        \"color\": \"Attention\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"TextBlock\",
                        \"text\": \"The **Build & Test Workflow** failed. Please review the logs below.\",
                        \"wrap\": true
                      },
                      {
                        \"type\": \"FactSet\",
                        \"facts\": [
                          {
                            \"title\": \"Repository:\",
                            \"value\": \"**sanchalkhedkar/angular**\"
                          },
                          {
                            \"title\": \"Workflow:\",
                            \"value\": \"main.yml\"
                          },
                          {
                            \"title\": \"Branch:\",
                            \"value\": \"main\"
                          },
                          {
                            \"title\": \"Status:\",
                            \"value\": \"Failure\"
                          },
                          {
                            \"title\": \"Commit:\",
                            \"value\": \"[7ce8438](https://github.com/octocat/support-bot/commit/7ce8438)\"
                          },
                          {
                            \"title\": \"Time:\",
                            \"value\": \"2025-05-27 15:25 UTC\"
                          }
                        ]
                      }
                    ],
                    \"actions\": [
                      {
                        \"type\": \"Action.OpenUrl\",
                        \"title\": \"📄 View Logs\",
                        \"url\": \"https://github.com/octocat/support-bot/actions/runs/1234567890\",
                        \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                      },
                      {
                        \"type\": \"Action.OpenUrl\",
                        \"title\": \"🔗 View Repository\",
                        \"url\": \"https://github.com/octocat/support-bot\",
                        \"iconUrl\": \"https://cdn-icons-png.flaticon.com/512/25/25231.png\"
                      }
                    ]
                  }
                }
              ]
            }"
