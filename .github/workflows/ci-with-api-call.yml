name: Angular CI with REST API Notification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular app
        run: npm run build

      - name: Notify success via Adaptive Card
        if: success()
        run: |
          curl -X POST YOUR_TEAMS_WEBHOOK_URL_HERE \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.3",
                    "body": [
                      {
                        "type": "TextBlock",
                        "size": "Large",
                        "weight": "Bolder",
                        "color": "Good",
                        "text": "✅ Build Succeeded!"
                      },
                      {
                        "type": "TextBlock",
                        "text": "Repository: '${{ github.repository }}'",
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "Branch: '${{ github.ref_name }}'",
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "Commit: '${{ github.sha }}'",
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "Triggered by: '${{ github.actor }}'",
                        "wrap": true
                      }
                    ]
                  }
                }
              ]
            }'
